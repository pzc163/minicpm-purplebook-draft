<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7351b5" /></marker></defs><rect width="1200" height="600" rx="18" fill="#faf8ff" /><text x="600" y="44" text-anchor="middle" font-size="30" fill="#292238" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">手机巡检记录的确认与同步流程</text><rect x="45" y="92" width="330" height="88" rx="12" fill="white" stroke="#b5a1d5" stroke-width="2" /><text x="210.0" y="128" text-anchor="middle" font-size="24" fill="#292238" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">拍照与位置</text><text x="210.0" y="157" text-anchor="middle" font-size="18" fill="#675f73" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">照片先保存在手机</text><rect x="430" y="92" width="330" height="88" rx="12" fill="white" stroke="#b5a1d5" stroke-width="2" /><text x="595.0" y="128" text-anchor="middle" font-size="24" fill="#292238" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">手机本地推理</text><text x="595.0" y="157" text-anchor="middle" font-size="18" fill="#675f73" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">仅提取可见信息</text><rect x="815" y="92" width="330" height="88" rx="12" fill="white" stroke="#b5a1d5" stroke-width="2" /><text x="980.0" y="128" text-anchor="middle" font-size="24" fill="#292238" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">人员核对修改</text><text x="980.0" y="157" text-anchor="middle" font-size="18" fill="#675f73" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">不自动确认草稿</text><path d="M378 136 L420 136" stroke="#7351b5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M764 136 L804 136" stroke="#7351b5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M980 185 L980 270" stroke="#7351b5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="1043" y="234" text-anchor="middle" font-size="19" fill="#292238" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">确认</text><rect x="815" y="282" width="330" height="88" rx="12" fill="white" stroke="#b5a1d5" stroke-width="2" /><text x="980.0" y="318" text-anchor="middle" font-size="24" fill="#292238" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">离线保存</text><text x="980.0" y="347" text-anchor="middle" font-size="18" fill="#675f73" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">冻结记录与固定 UUID</text><rect x="430" y="282" width="330" height="88" rx="12" fill="white" stroke="#b5a1d5" stroke-width="2" /><text x="595.0" y="318" text-anchor="middle" font-size="24" fill="#292238" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">显式同步</text><text x="595.0" y="347" text-anchor="middle" font-size="18" fill="#675f73" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">回复匹配后标记成功</text><rect x="45" y="282" width="330" height="88" rx="12" fill="white" stroke="#b5a1d5" stroke-width="2" /><text x="210.0" y="318" text-anchor="middle" font-size="24" fill="#292238" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">业务台账</text><text x="210.0" y="347" text-anchor="middle" font-size="18" fill="#675f73" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">去重写入与状态更新</text><path d="M807 326 L769 326" stroke="#7351b5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M421 326 L383 326" stroke="#7351b5" stroke-width="3" fill="none" marker-end="url(#arrow)" /><path d="M980 370 L980 405 L595 405 L595 377" fill="none" stroke="#a58fcb" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" /><text x="770" y="444" text-anchor="middle" font-size="20" fill="#675f73" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">同步失败：保留同一记录，等待再次同步</text><text 